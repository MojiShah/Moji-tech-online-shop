openapi: 3.0.3
info:
  title: Online Tech API
  version: 1.0.0
  description: E-commerce REST API for Online Tech
paths:
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Checks whether the API service is running.
      summary: Check API health
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
  /api/v1/health/db/:
    get:
      operationId: v1_health_db_retrieve
      description: Checks connectivity to PostgreSQL.
      summary: Check database Health
      tags:
      - Core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealth'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealth'
          description: ''
components:
  schemas:
    DatabaseHealth:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        service:
          type: string
      required:
      - service
      - status
    HealthCheck:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
      required:
      - service
      - status
      - version
    StatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
