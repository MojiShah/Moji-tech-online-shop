openapi: 3.0.3
info:
  title: Online Tech API
  version: 1.0.0
  description: E-commerce REST API for Online Tech
paths:
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Creates a new account without issuing JWT tokens. Email verification
        is required before login.
      summary: Register with email and password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Checks whether the API service is running.
      summary: Check API health
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
  /api/v1/health/db/:
    get:
      operationId: v1_health_db_retrieve
      description: Checks connectivity to PostgreSQL.
      summary: Check database Health
      tags:
      - Core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealth'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealth'
          description: ''
components:
  schemas:
    APIError:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    DatabaseHealth:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        service:
          type: string
      required:
      - service
      - status
    ErrorDetail:
      type: object
      properties:
        status_code:
          type: integer
        details: {}
      required:
      - details
      - status_code
    HealthCheck:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
      required:
      - service
      - status
      - version
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
        password_confirm:
          type: string
          writeOnly: true
          maxLength: 128
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
      - password_confirm
    StatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    UserPublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        phone_number:
          type: string
          readOnly: true
          nullable: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        is_phone_verified:
          type: boolean
          readOnly: true
      required:
      - email
      - first_name
      - id
      - is_email_verified
      - is_phone_verified
      - last_name
      - phone_number
